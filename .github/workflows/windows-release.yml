name: Windows release verification

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Unit and static validation
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/static_validate.py

  build-windows-x64:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # One canonical release toolchain; both supported source runtimes are tested above.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Read single version and validate release tag
        id: version
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from release_metadata import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag does not match release_metadata.VERSION'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build self-contained plugin
        run: python scripts/build_windows_release.py
      - name: Verify exact release tree and executable probes
        run: python scripts/verify_windows_release.py "dist/golden-finger-${{ steps.version.outputs.version }}" --expected-commit "${{ github.sha }}" --require-clean
      - name: Verify packaged recovery and connector roundtrips in isolated fixtures
        run: |
          $env:GOLDEN_FINGER_RELEASE_PACKAGE = (Resolve-Path "dist/golden-finger-${{ steps.version.outputs.version }}").Path
          python -m unittest discover -s tests -p test_release_enhancements.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/verify_mcp_release.py --package "$env:GOLDEN_FINGER_RELEASE_PACKAGE"
      - name: Verify the actual ZIP after extraction
        run: |
          $archive = "dist/golden-finger-${{ steps.version.outputs.version }}-windows-x64.zip"
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath build/zip-verification
          python scripts/verify_windows_release.py "build/zip-verification/golden-finger-${{ steps.version.outputs.version }}" --expected-commit "${{ github.sha }}" --require-clean
      - uses: actions/upload-artifact@v4
        with:
          name: golden-finger-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: golden-finger-windows-x64
          path: release
      - name: Publish the verified artifact without rebuilding or replacing a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-windows-x64.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check "golden-finger-${RELEASE_VERSION}-windows-x64.zip.sha256"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Codex金手指 ${RELEASE_VERSION}" \
            "golden-finger-${RELEASE_VERSION}-windows-x64.zip" \
            "golden-finger-${RELEASE_VERSION}-windows-x64.zip.sha256"
